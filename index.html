<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Llenguatge musical Rockin</title>
<meta name="description" content="Llenguatge musical aplicat als instruments de Rockin: guitarra, baix, bateria, teclat i dictat rítmic amb les cartes.">
<link rel="icon" type="image/png" href="marca/favicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Ubuntu:wght@400;500;700&family=Ubuntu+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: barra groga Rockin fixa; a sota, una pantalla cada vegada (inici → repertori de temes → escolta / aprèn / repte / toca amb la banda), columna de màx. 960px */
:root{
  --paper:#F2F2EF; --surface:#FFFFFF; --sunk:#EAEAE6; --ink:#1B1B19; --muted:#63625C; --line:#DAD9D3;
  --yellow:#FFC012; --on-yellow:#1B1B19;
  --ok:#1E7D46; --ok-bg:#DDF0E4; --bad:#BF3A2F; --bad-bg:#F7DEDA; --hint:#2B57D1;
  --i8:#1B1B19; --i5:#2B57D1; --i4:#0B8278; --i3M:#C9480F; --i3m:#8E36A8;
  --hd:#2B57D1; --he:#C4400B;
  --wkey:#FFFFFF; --wkey-ink:#1B1B19; --bkey:#1E1D1A; --keyline:#B5B3AA;
  --g-gtr:#E8A800; --g-bass:#1FA597; --g-drum:#E2476F; --g-keys:#2E95D3; --g-dict:#8A63D2;
  --f-ui:'Ubuntu','Trebuchet MS',system-ui,sans-serif;
  --f-text:'Lora',Georgia,'Times New Roman',serif;
  --f-mono:'Ubuntu Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#131312; --surface:#1C1C1A; --sunk:#242422; --ink:#ECEBE6; --muted:#A2A098; --line:#33322E;
    --ok:#4CC47F; --ok-bg:#163423; --bad:#FF6F62; --bad-bg:#41201C; --hint:#86A3FF;
    --i8:#ECEBE6; --i5:#86A3FF; --i4:#3CC8BA; --i3M:#FF8B4F; --i3m:#D47EEC;
    --hd:#86A3FF; --he:#FF8B4F;
    --wkey:#E8E5DC; --bkey:#0B0B0A; --keyline:#57544D;
    --g-gtr:#FFC012; --g-bass:#2EC4B6; --g-drum:#FF5C8A; --g-keys:#4CB4F2; --g-dict:#A783EE;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#131312; --surface:#1C1C1A; --sunk:#242422; --ink:#ECEBE6; --muted:#A2A098; --line:#33322E;
  --ok:#4CC47F; --ok-bg:#163423; --bad:#FF6F62; --bad-bg:#41201C; --hint:#86A3FF;
  --i8:#ECEBE6; --i5:#86A3FF; --i4:#3CC8BA; --i3M:#FF8B4F; --i3m:#D47EEC;
  --hd:#86A3FF; --he:#FF8B4F;
  --wkey:#E8E5DC; --bkey:#0B0B0A; --keyline:#57544D;
  --g-gtr:#FFC012; --g-bass:#2EC4B6; --g-drum:#FF5C8A; --g-keys:#4CB4F2; --g-dict:#A783EE;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hint);outline-offset:2px}

.bar{background:var(--yellow);color:var(--on-yellow);position:sticky;top:env(safe-area-inset-top,0px);z-index:30}
.bar-in{max-width:960px;margin:0 auto;padding:9px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;color:inherit;min-width:0;border:0;background:none;padding:0}
.logo-img{height:1.45rem;width:auto;display:block;filter:brightness(0)}
.sub{font-family:var(--f-text);font-style:italic;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.snd{margin-left:auto;border:1.5px solid var(--on-yellow);background:transparent;color:var(--on-yellow);border-radius:8px;padding:3px 10px;font-weight:500;font-size:.85rem;white-space:nowrap}
.snd[aria-pressed="false"]{opacity:.55;text-decoration:line-through}

#app{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:24px 60px}
.screen{animation:enter .22s ease both}
@keyframes enter{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

.btn{border:1.5px solid var(--ink);border-radius:10px;padding:9px 16px;font-weight:500;font-size:.95rem;background:var(--ink);color:var(--paper);transition:transform .06s,opacity .15s}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:default}
.btn.acc{background:var(--yellow);color:var(--on-yellow);border-color:var(--yellow)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover:not(:disabled){border-color:var(--ink)}
.btn.big{font-size:1.05rem;padding:12px 24px;font-weight:700}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.right{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.wrong{background:var(--bad);border-color:var(--bad);color:#fff;animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
@keyframes pop{0%{transform:scale(.85)}70%{transform:scale(1.05)}100%{transform:scale(1)}}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tog{display:flex;gap:7px;align-items:center;font-size:.9rem}
.tog input{accent-color:var(--ink);width:16px;height:16px}
select{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 8px}

/* inici */
.home h1{font-size:clamp(1.8rem,4.6vw,2.6rem);margin:4px 0 6px;letter-spacing:-.02em;text-wrap:balance}
.lead{font-family:var(--f-text);font-size:1.05rem;color:var(--muted);margin:0 0 24px;max-width:62ch}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.tile{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:16px;text-align:left;display:grid;gap:3px;align-content:start;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--ink);transform:translateY(-2px)}
.ticon{width:46px;height:46px;border-radius:10px;background:var(--g);color:#1B1B19;padding:7px;margin-bottom:8px;display:block}
.ticon svg{width:100%;height:100%;display:block}
.tname{font-size:1.25rem;font-weight:700}
.tsub{font-family:var(--f-text);color:var(--muted);font-size:.95rem}
.tprog{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden;margin-top:12px}
.tprog i{display:block;height:100%;background:var(--g)}
.tcount{font-size:.78rem;color:var(--muted);font-family:var(--f-mono)}
.teacher{margin-top:26px;color:var(--muted)}

/* repertori */
.maphead{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.maphead .ticon{margin:0}
.maphead h1{margin:0;font-size:clamp(1.5rem,4vw,2rem);letter-spacing:-.01em}
.maphead p{margin:0;color:var(--muted);font-family:var(--f-text)}
.maphead .grow{flex:1;min-width:0}
.back{width:40px;height:40px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font-size:1.1rem;display:grid;place-items:center;flex:none}
.back:hover{border-color:var(--ink)}
.tema{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:16px;overflow:hidden}
.tema-h{padding:14px 16px 12px;display:grid;gap:2px;border-bottom:1.5px solid var(--line)}
.tema-k{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);letter-spacing:.04em}
.tema-n{font-size:1.2rem;font-weight:700}
.tema-c{font-family:var(--f-text);color:var(--muted);font-size:.95rem;max-width:70ch}
.prog{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.prog span{font-family:var(--f-mono);font-weight:700;font-size:.85rem;border:1.5px solid var(--line);border-radius:6px;padding:2px 8px;transition:background .1s}
.prog span.on{background:var(--g);border-color:var(--g);color:#1B1B19}
.prog span.done{border-color:var(--ok);color:var(--ok)}
.trk{display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:11px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.trk:first-of-type{border-top:0}
.trk:hover:not(.locked){background:var(--sunk)}
.trk .num{font-family:var(--f-mono);color:var(--muted);font-size:.9rem}
.trk .tt{font-weight:500;min-width:0}
.trk .ty{display:block;font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:500}
.trk .st{font-family:var(--f-mono);font-size:.85rem;color:var(--muted);white-space:nowrap}
.trk .st .ck{color:var(--ok);font-weight:700}
.trk .st .nx{background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 8px;font-family:var(--f-ui);font-size:.78rem;font-weight:700}
.trk.locked{opacity:.45;cursor:not-allowed}
.trk.cur .num{color:var(--ink);font-weight:700}
.stars{letter-spacing:1px}
.stars b{color:var(--g-gtr);font-weight:400}

/* HUD i escenari */
.hud{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.htitle{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
.pips{flex:1;display:flex;gap:4px;min-width:0}
.pip{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .25s}
.pip.cur{background:var(--muted)}
.pip.net,.pip.done{background:var(--ok)} .pip.aj{background:#D9A100} .pip.no{background:var(--bad)}
.stage{--g:var(--g-gtr);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px;position:relative}
.stage>*,.larea>*,.fbx,.kbx{min-width:0}
.stage h2{margin:0;font-size:clamp(1.3rem,3.4vw,1.7rem);letter-spacing:-.01em;text-wrap:balance}
.ltext{margin:0;font-family:var(--f-text);font-size:1.06rem;max-width:64ch}
.ltext b{font-family:var(--f-ui)}
.say{margin:0;min-height:1.5em;font-family:var(--f-text);font-size:1.03rem;max-width:72ch}
.say.ok{color:var(--ok);animation:pop .25s} .say.bad{color:var(--bad)} .say.hint{color:var(--hint)}
.say b{font-family:var(--f-ui)}
.lfoot{display:flex;justify-content:flex-end}
.kicker{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.prompt{font-size:clamp(1.25rem,3.4vw,1.7rem);font-weight:500;text-wrap:balance}
.prompt b{font-weight:700;box-shadow:inset 0 -.35em 0 color-mix(in srgb,var(--g) 45%,transparent)}
.subq{color:var(--muted);font-size:.92rem}
.splash{display:grid;justify-items:start;gap:12px;padding:6px 0}
.splash h2{font-size:clamp(1.6rem,4.6vw,2.2rem)}
.splash p{font-family:var(--f-text);font-size:1.05rem;max-width:58ch;margin:0}
.tip{border-left:3px solid var(--g);padding:4px 0 4px 12px;font-family:var(--f-text);max-width:60ch}
.needs{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-family:var(--f-text)}
.needs li{display:grid;grid-template-columns:2rem minmax(0,1fr);align-items:baseline}
.needs li::before{content:attr(data-n);font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.tempo{display:flex;align-items:center;gap:10px}
.bpm{font-family:var(--f-mono);font-size:1.15rem;font-weight:700;min-width:5.5ch;font-variant-numeric:tabular-nums;text-align:center}
.result{display:grid;gap:10px;justify-items:start}
.bignum{font-family:var(--f-mono);font-size:clamp(3rem,10vw,4.6rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.meter{display:flex;gap:4px}
.meter i{width:46px;height:8px;border-radius:4px;background:var(--line)}
.meter i.on{background:var(--g)}
.overlay{position:absolute;inset:0;border-radius:13px;background:color-mix(in srgb,var(--surface) 92%,transparent);display:grid;place-items:center;z-index:20;text-align:center}
.overlay .big{font-size:clamp(2rem,7vw,3.2rem);font-weight:700;animation:pop .3s}
.timebar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.timebar i{display:block;height:100%;width:100%;background:var(--g);transform-origin:left}
.timebar.low i{background:var(--bad)}
.formula{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:1.1rem}
.formula .fn{background:var(--ink);color:var(--paper);border-radius:8px;padding:4px 11px;font-weight:700}
.formula .ar{font-family:var(--f-mono);font-weight:700;color:var(--hint);font-size:1.2rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:8px;padding:4px 10px;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.row label{display:flex;gap:6px;align-items:center;font-size:.9rem}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{min-width:3.6rem;border:1.5px dashed var(--line);border-radius:10px;padding:6px 10px;display:grid;justify-items:center;gap:1px}
.slot b{font-family:var(--f-mono);font-size:1.15rem}
.slot i{font-style:normal;font-size:.78rem;color:var(--muted);min-height:1.1em}
.slot.cur{border-style:solid;border-color:var(--ink)}
.slot.done{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.slot.done i{color:var(--ok);font-weight:700}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.85rem;color:var(--muted)}
.legend b{font-family:var(--f-mono);color:var(--ink)}

/* pal */
.fbwrap{overflow-x:auto;padding:4px 0 2px}
.fb{display:grid;--row:2.2rem;min-width:36rem;position:relative}
.fb.bass{--row:2.55rem}
.wood{background:linear-gradient(180deg,#3d2416 0%,#563420 18%,#4b2c1a 50%,#5a3722 82%,#3d2416 100%);border-radius:2px;box-shadow:inset 0 2px 5px rgba(0,0,0,.5),0 3px 0 #2a180e;z-index:0}
.inlay{display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:1;pointer-events:none}
.inlay.dbl{justify-content:space-evenly}
.inlay i{width:.85rem;height:.85rem;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffdf6 0,#e9e2d0 55%,#bfb59d 100%);box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.slab{display:flex;align-items:center;gap:5px;font-size:.78rem;color:var(--muted);padding-right:4px;white-space:nowrap}
.slab b{display:inline-grid;place-items:center;width:1.15rem;height:1.15rem;border-radius:50%;border:1.5px solid var(--muted);font-size:.66rem;font-weight:700}
.cell{position:relative;border:0;padding:0;background:transparent;z-index:2;border-right:3px solid #d6d6cf;box-shadow:inset -1px 0 0 rgba(0,0,0,.35);height:var(--row)}
.cell.open{border-right:9px solid #efe6cc;box-shadow:inset -1px 0 0 rgba(0,0,0,.15)}
.cell::before{content:"";position:absolute;left:0;right:0;top:50%;height:var(--th,1.5px);transform:translateY(-50%);background:linear-gradient(180deg,#fbfbf7,#9d9d96);box-shadow:0 1px 1.5px rgba(0,0,0,.55)}
.cell.wound::before{background:repeating-linear-gradient(90deg,#e9d6a7 0 1px,#b38f55 1px 2px)}
.fb.bass .cell::before{background:repeating-linear-gradient(90deg,#efefe9 0 1px,#9a9a93 1px 2px)}
.cell .dot{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(0);width:1.9rem;height:1.9rem;border-radius:50%;display:grid;place-items:center;font-size:.72rem;font-weight:700;color:#fff;background:#1B1B19;transition:transform .12s cubic-bezier(.3,1.5,.6,1);z-index:3;pointer-events:none;line-height:1;white-space:nowrap;box-shadow:0 2px 3px rgba(0,0,0,.45)}
.cell.m .dot{transform:translate(-50%,-50%) scale(1)}
.cell.root .dot{background:#FFC012;color:#1B1B19;box-shadow:0 0 0 2px #1B1B19,0 2px 3px rgba(0,0,0,.45)}
.cell.ok .dot{background:#22A35A}
.cell.bad .dot{background:#E0453A}
.cell.below .dot{opacity:.6}
.cell.ghost .dot{background:#2a1a10;color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.75)}
.cell.lit .dot{background:#FFC012;color:#1B1B19;transform:translate(-50%,-50%) scale(1.12)}
.cell.lit.fr .dot{background:#fff}
.cell.hintring::after,.cell.miss::after{content:"";position:absolute;left:50%;top:50%;width:2.25rem;height:2.25rem;transform:translate(-50%,-50%);border-radius:50%;border:3px dashed #fff;z-index:2;animation:ring 1.2s ease-in-out infinite}
.cell.miss::after{border:3px solid #FF6F62;animation:none}
@keyframes ring{50%{transform:translate(-50%,-50%) scale(1.15)}}
.cell:hover:not(.m)::after{content:"";position:absolute;left:50%;top:50%;width:1.1rem;height:1.1rem;transform:translate(-50%,-50%);border-radius:50%;background:rgba(255,255,255,.28)}
.cell.open:hover:not(.m)::after{background:color-mix(in srgb,var(--ink) 20%,transparent)}
.fnum{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);text-align:center;padding-top:5px}
.fnum.mk{color:var(--ink);font-weight:700}

/* teclat */
.kbwrap{overflow-x:auto;padding-bottom:4px}
.kb{position:relative;display:flex;height:11rem;min-width:46rem;user-select:none}
.wk{flex:1;border:1.5px solid var(--keyline);border-left-width:0;background:var(--wkey);color:var(--wkey-ink);border-radius:0 0 7px 7px;position:relative;padding:0 0 8px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:.72rem;font-weight:700;box-shadow:inset 0 -5px 0 rgba(0,0,0,.05)}
.wk:first-child{border-left-width:1.5px}
.bk{position:absolute;top:0;height:62%;background:var(--bkey);color:#fff;border:1.5px solid var(--bkey);border-radius:0 0 5px 5px;z-index:3;padding:0 0 6px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px;font-size:.62rem;font-weight:700}
.wk .sm,.bk .sm{font-family:var(--f-mono);font-size:.88rem;line-height:1;font-weight:700;background:#2B57D1;color:#fff;border-radius:5px;padding:2px 5px}
.wk .sm:empty,.bk .sm:empty{display:none}
.wk .nl,.bk .nl{line-height:1}
.wk.cmark .nl{color:#8a887f}
.wk.sel,.bk.sel{background:#FFC012;color:#1B1B19;border-color:#B98500}
.wk.ok,.bk.ok{background:#22A35A;color:#fff;border-color:#22A35A}
.wk.bad,.bk.bad{background:#E0453A;color:#fff;border-color:#E0453A}
.wk.hintk,.bk.hintk{box-shadow:inset 0 0 0 4px #2B57D1}
.wk.rootk,.bk.rootk{box-shadow:inset 0 0 0 4px #FFC012}
.wk.ex,.bk.ex{background:#4CB4F2;color:#1B1B19;border-color:#1B1B19}

/* bateria */
.patwrap{overflow-x:auto}
.pat{display:flex;flex-wrap:wrap;gap:14px 0}
.pat.hidepat .stk span{visibility:hidden}
.barx{display:flex;border-left:2px solid var(--ink);padding-left:6px;margin-right:6px}
.barx:last-child{border-right:3px double var(--ink);padding-right:6px}
.beat{display:flex;flex-direction:column;padding:0 4px}
.strokes{display:grid;grid-template-columns:repeat(var(--sub),2.1rem);gap:2px}
.stk{display:grid;grid-template-rows:1rem 1.7rem 1.7rem;justify-items:center;align-items:center;border-radius:6px;font-weight:700;font-size:1.15rem;transition:background .06s}
.stk .ac{font-size:.95rem;font-family:var(--f-mono)}
.stk .r1{color:var(--hd)} .stk .r2{color:var(--he)}
.stk.acc .r1,.stk.acc .r2{font-size:1.45rem}
.stk:not(.acc) .r1,.stk:not(.acc) .r2{opacity:.8;font-weight:500}
.stk.now{background:var(--yellow)}
.stk.now span{color:var(--on-yellow)}
.stk.good{background:var(--ok-bg)} .stk.wh{background:#FFE3A3} .stk.miss{background:var(--bad-bg)}
.bn{font-family:var(--f-mono);font-size:.8rem;color:var(--muted);border-top:1px solid var(--line);margin-top:4px;padding-top:3px;display:flex;gap:6px;align-items:center}

<script>
/* ================= utilitats ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const mod=(n,m)=>((n%m)+m)%m, rand=n=>Math.floor(Math.random()*n), pick=a=>a[rand(a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const LET=['Do','Re','Mi','Fa','Sol','La','Si'], LET_US=['C','D','E','F','G','A','B'], LET_PC=[0,2,4,5,7,9,11];

const nm=(n,us)=>(us?LET_US:LET)[n.l]+accStr(n.acc);
const pcOf=n=>mod(LET_PC[n.l]+n.acc,12);
function spellFrom(root,semis,steps){const l=(root.l+steps)%7;const pc=mod(pcOf(root)+semis,12);let acc=pc-LET_PC[l];if(acc>6)acc-=12;if(acc<-6)acc+=12;return{l,acc}}
const awkward=n=>Math.abs(n.acc)>1||(n.l===0&&n.acc===-1)||(n.l===3&&n.acc===-1)||(n.l===2&&n.acc===1)||(n.l===6&&n.acc===1);

/* ================= desament ================= */

const Store={

/* ================= so ================= */
const Snd={
  on:true,ctx:null,master:null,out:null,cache:{},
  ac(){
    if(!this.ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;this.ctx=new C();this.master=this.ctx.createGain();this.master.gain.value=.8;

  session(){const c=this.ac();if(!c)return()=>{};const b=c.createGain();b.connect(this.master);this.out=b;return()=>{try{b.gain.setValueAtTime(0,c.currentTime);b.disconnect()}catch(e){}if(this.out===b)this.out=null}},
  ks(midi,dur,damp){

  },
  buf(midi,bass){const k=midi+(bass?'b':'g');if(!this.cache[k])this.cache[k]=this.ks(midi,bass?2.2:1.8,bass?.998:.996);return this.cache[k]},
  pluckAt(midi,bass,t,vol=1,dur){

  },
  pluck(midi,bass,delay=0){if(!this.on)return;const c=this.ac();if(!c)return;this.pluckAt(midi,bass,c.currentTime+.01+delay)},
  pair(a,b,bass){this.pluck(a,bass);this.pluck(b,bass,.45);this.pluck(a,bass,1);this.pluck(b,bass,1)},
  curve(){if(!this._cv){const n=1024,cv=new Float32Array(n),k=9;for(let i=0;i<n;i++){const x=i*2/n-1;cv[i]=(1+k)*x/(1+k*Math.abs(x))}this._cv=cv}return this._cv},
  gtr(midis,t,dur=.6,vol=1){
    if(!this.on)return;const c=this.ctx;const mix=c.createGain();mix.gain.value=.55;
    midis.forEach((m,i)=>{const s=c.createBufferSource();s.buffer=this.buf(m,false);s.connect(mix);s.start(t+i*.008);s.stop(t+dur+.1)});
    const ws=c.createWaveShaper();ws.curve=this.curve();const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;const hp=c.createBiquadFilter();hp.type='highpass';hp.frequency.value=90;
    const g=c.createGain();g.gain.setValueAtTime(.16*vol,t);g.gain.setValueAtTime(.16*vol,t+dur*.7);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    mix.connect(ws).connect(hp).connect(lp).connect(g).connect(this.dest());
  },
  power(midis){if(!this.on)return;const c=this.ac();if(!c)return;this.gtr(midis,c.currentTime+.02,1.6)},
  key(midi,t,dur=1.6,vel=.22){
    const c=this.ctx,f=440*2**((midi-69)/12),g=c.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vel,t+.008);
    g.gain.exponentialRampToValueAtTime(vel*.35,t+Math.min(.35,dur*.5));g.gain.exponentialRampToValueAtTime(.001,t+dur);
    [[1,'triangle',1],[2,'sine',.35],[3,'sine',.12],[4,'sine',.05]].forEach(([m,type,a])=>{

  },
  note(midi){if(!this.on)return;const c=this.ac();if(!c)return;this.key(midi,c.currentTime+.01,1.3,.24)},
  chord(midis,arp){

  },
  ok(){if(!this.on)return;const c=this.ac();if(!c)return;const t=c.currentTime+.01;this.key(84,t,.4,.08);this.key(91,t+.08,.6,.08)},
  no(){if(!this.on)return;const c=this.ac();if(!c)return;const t=c.currentTime+.01,o=c.createOscillator();o.type='triangle';o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(150,t+.18);const g=c.createGain();g.gain.setValueAtTime(.14,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g).connect(this.dest());o.start(t);o.stop(t+.25)},
  nb(){if(!this._nb){const c=this.ctx,b=c.createBuffer(1,c.sampleRate*.5,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;this._nb=b}return this._nb},
  noise(t,type,freq,q,vol,dec){const c=this.ctx,s=c.createBufferSource();s.buffer=this.nb();const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dec);s.connect(f).connect(g).connect(this.dest());s.start(t);s.stop(t+dec+.02)},
  stick(t,hand,acc){if(!this.on)return;const v=acc?.95:.32;this.noise(t,'bandpass',hand==='D'?2700:1900,1.3,v,.07);

  hat(t,v=.18){if(!this.on)return;this.noise(t,'highpass',7500,.7,v,.045)},
  snare(t,v=.5){if(!this.on)return;this.noise(t,'bandpass',1900,.6,v,.17);const c=this.ctx,o=c.createOscillator();o.type='triangle';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(150,t+.08);const g=c.createGain();g.gain.setValueAtTime(v*.6,t);g.gain.exponentialRampToValueAtTime(.001,t+.1);o.connect(g).connect(this.dest());o.start(t);o.stop(t+.12)},
  click(t,strong){if(!this.on)return;const c=this.ctx,o=c.createOscillator();o.type='sine';o.frequency.value=strong?1900:1350;const g=c.createGain();g.gain.setValueAtTime(strong?.4:.26,t);g.gain.exponentialRampToValueAtTime(.001,t+.035);o.connect(g).connect(this.dest());o.start(t);o.stop(t+.05)},
  kick(t,v=.95){if(!this.on)return;const c=this.ctx,o=c.createOscillator();o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);const g=c.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.32);o.connect(g).connect(this.dest());o.start(t);o.stop(t+.35)},
  tone(midi,t,dur,v=.28){if(!this.on)return;const c=this.ctx,f=440*2**((midi-69)/12),g=c.createGain();
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(v*.45,t+Math.max(.02,dur*.6));g.gain.linearRampToValueAtTime(0,t+dur);
    [[1,'triangle',1],[2,'sine',.3],[3,'sine',.1]].forEach(([m,type,a])=>{const o=c.createOscillator();o.type=type;o.frequency.value=f*m;const og=c.createGain();og.gain.value=a;o.connect(og).connect(g);o.start(t);o.stop(t+dur+.02)});
    g.connect(this.dest())}
};

/* ================= cicle de pantalles ================= */

const later=(fn,ms)=>{const t=setTimeout(fn,ms);onCleanup(()=>clearTimeout(t));return t};

function mkSay(el){return(h,k='')=>{el.innerHTML=h;el.className='say '+k}}

/* ================= icones ================= */
const ICONS={
  gtr:`<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M28 36 52 12"/><path d="m48 8 8 8"/><path d="M27 25c-5-3-12-1-14 4-3 1-6 4-6 9 0 9 9 18 18 18 5 0 8-3 9-6 5-2 7-9 4-14-2-4-6-5-8-4"/><circle cx="23" cy="41" r="3.5"/></svg>`,

const LOCK='<svg width="14" height="14" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linejoin="round" aria-label="Tancada"><rect x="10" y="18" width="20" height="15" rx="3"/><path d="M14 18v-4a6 6 0 0 1 12 0v4"/></svg>';
/* ================= pal ================= */
const GTR={tuning:[40,45,50,55,59,64],strNames:['Mi','La','Re','Sol','Si','Mi'],bass:false};
const BAS={tuning:[28,33,38,43],strNames:['Mi','La','Re','Sol'],bass:true};
class Fretboard{
  constructor(host,inst){
    this.inst=inst;this.cells={};const S=inst.tuning.length;this.S=S;
    const ws=[];for(let n=1;n<=12;n++)ws.push((2**(-(n-1)/12)).toFixed(3)+'fr');
    let h=`<div class="fb${inst.bass?' bass':''}" style="grid-template-columns:3rem 2.3rem ${ws.join(' ')};grid-template-rows:repeat(${S},var(--row)) 1.5rem">`;
    h+=`<div class="wood" style="grid-row:1/span ${S};grid-column:3/-1"></div>`;
    [3,5,7,9,12].forEach(f=>h+=`<div class="inlay${f===12?' dbl':''}" style="grid-row:1/span ${S};grid-column:${f+2}"><i></i>${f===12?'<i></i>':''}</div>`);
    for(let r=0;r<S;r++){const s=S-1-r,num=r+1;
      const th=(inst.bass?1.6:.8)+(S-1-s)*(inst.bass?.6:.38),wound=!inst.bass&&s<=2;
      h+=`<div class="slab" style="grid-row:${r+1};grid-column:1"><b>${num}</b>${inst.strNames[s]}</div>`;
      for(let f=0;f<=12;f++)h+=`<button class="cell${f===0?' open':''}${wound?' wound':''}" style="grid-row:${r+1};grid-column:${f+2};--th:${th.toFixed(2)}px" data-s="${s}" data-f="${f}" aria-label="Corda ${num} (${inst.strNames[s]}), ${f===0?'a l\'aire':'trast '+f}"><span class="dot"></span></button>`;
    }
    for(let f=0;f<=12;f++)h+=`<div class="fnum${[3,5,7,9,12].includes(f)?' mk':''}" style="grid-row:${S+1};grid-column:${f+2}">${f}</div>`;
    h+='</div>';
    const w=document.createElement('div');w.className='fbwrap';w.innerHTML=h;host.appendChild(w);this.el=$('.fb',w);
    $$('.cell',w).forEach(b=>this.cells[b.dataset.s+'-'+b.dataset.f]=b);
    this.el.addEventListener('click',e=>{const b=e.target.closest('.cell');if(b&&this.onCell)this.onCell(+b.dataset.s,+b.dataset.f)});
  }
  midi(s,f){return this.inst.tuning[s]+f}
  pc(s,f){return mod(this.midi(s,f),12)}
  play(s,f){Snd.pluck(this.midi(s,f),this.inst.bass)}

  mark(s,f,cls,label,bg){const c=this.c(s,f);if(!c)return;clearTimeout(c._t);c.classList.remove('bad','ok','root','below','ghost','lit','fr');c.classList.add('m',...(cls||'').split(' ').filter(Boolean));const d=c.querySelector('.dot');d.textContent=label||'';d.style.background=bg||'';return c}
  unmark(s,f){const c=this.c(s,f);c.classList.remove('m','root','ok','bad','below','miss','ghost','lit','fr');const d=c.querySelector('.dot');d.textContent='';d.style.background=''}
  clear(){Object.values(this.cells).forEach(c=>{clearTimeout(c._t);c.classList.remove('m','root','ok','bad','below','hintring','miss','ghost','lit','fr');const d=c.querySelector('.dot');d.textContent='';d.style.background=''})}
  flashBad(s,f,label){const c=this.mark(s,f,'bad',label);c._t=setTimeout(()=>{if(c.classList.contains('bad'))this.unmark(s,f)},1300)}

}
function shape(s1,f1,s2,f2){
  const ds=s2-s1,df=f2-f1;
  const sp=ds===0?'a la mateixa corda':ds>0?(ds>1?`${ds} cordes més agudes`:'la corda més aguda del costat'):(ds<-1?`${-ds} cordes més greus`:'la corda més greu del costat');
  const fp=df===0?'al mateix trast':df>0?`${df} trast${df>1?'s':''} a la dreta`:`${-df} trast${df<-1?'s':''} a l'esquerra`;
  return sp+', '+fp;
}
const crossesGB=(inst,s1,s2)=>!inst.bass&&Math.min(s1,s2)<=3&&Math.max(s1,s2)>=4;
function autoRoot(inst,pc){let best=null;for(const s of [0,1])for(let f=0;f<=10;f++)if(mod(inst.tuning[s]+f,12)===pc){const cost=Math.abs(f-4.5)+s*.4+(f===0?2:0);if(!best||cost<best.c)best={s,f,c:cost,m:inst.tuning[s]+f}}return best}
function nearPos(inst,midi,root){let best=null;for(let s=0;s<inst.tuning.length;s++){const f=midi-inst.tuning[s];if(f<0||f>12||Math.abs(f-root.f)>4||(s===root.s&&f!==root.f&&midi!==root.m))continue;const cost=Math.abs(f-root.f)+1.3*Math.abs(s-root.s);if(!best||cost<best.c)best={s,f,c:cost}}return best}

class Keys{
  constructor(host,lo=36,hi=84){
    this.lo=lo;this.hi=hi;this.k={};let h='',wi=0;const whites=[];
    for(let m=lo;m<=hi;m++)if(LET_PC.includes(mod(m,12)))whites.push(m);
    const W=whites.length;
    for(let m=lo;m<=hi;m++){const pc=mod(m,12);
      if(LET_PC.includes(pc)){h+=`<button class="wk" data-m="${m}" aria-label="${PC_NAME[pc]}"><span class="sm"></span><span class="nl"></span></button>`;wi++}
      else h+=`<button class="bk" data-m="${m}" style="left:calc(${wi}/${W}*100% - (100%/${W})*.31);width:calc(100%/${W}*.62)" aria-label="${PC_NAME[pc]}"><span class="sm"></span><span class="nl"></span></button>`;
    }
    const w=document.createElement('div');w.className='kbwrap';w.innerHTML=`<div class="kb">${h}</div>`;host.appendChild(w);
    $$('[data-m]',w).forEach(k=>this.k[k.dataset.m]=k);
    w.addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b&&this.onKey)this.onKey(+b.dataset.m)});
    this.reset();
  }
  reset(names='do'){Object.entries(this.k).forEach(([m,k])=>{const pc=mod(+m,12),white=k.classList.contains('wk');k.className=white?'wk':'bk';if(white&&pc===0)k.classList.add('cmark');
    $('.nl',k).textContent=(names==='all'||(names==='do'&&pc===0))?PC_NAME[pc]:'';$('.sm',k).textContent=''})}
  mark(m,cls,label,sm){const k=this.k[m];if(!k)return;if(cls)k.classList.add(...cls.split(' '));if(label!==undefined)$('.nl',k).textContent=label;if(sm!==undefined)$('.sm',k).textContent=sm}
  ruler(root,n=12){for(let i=1;i<=n&&root+i<=this.hi;i++)$('.sm',this.k[root+i]).textContent=i}
  flash(m,label){const k=this.k[m];k.classList.add('bad');const nl=$('.nl',k),old=nl.textContent;nl.textContent=label;setTimeout(()=>{k.classList.remove('bad');nl.textContent=old},900)}
}

class Pads{
  constructor(host){
    const w=document.createElement('div');w.className='pads';
    w.innerHTML=`<button class="pad pe" data-h="E"><b>E</b><span>mà esquerra · tecla F</span></button><button class="pad pd" data-h="D"><b>D</b><span>mà dreta · tecla J</span></button>`;
    host.appendChild(w);this.w=w;
    w.addEventListener('pointerdown',e=>{const b=e.target.closest('.pad');if(b){e.preventDefault();this.hit(b.dataset.h)}});
    this.kd=e=>{if(!document.body.contains(this.w)){this.destroy();return}if(e.repeat||e.metaKey||e.ctrlKey)return;const k=e.key.toLowerCase();if(k==='f'){e.preventDefault();this.hit('E')}else if(k==='j'){e.preventDefault();this.hit('D')}};
    document.addEventListener('keydown',this.kd);onCleanup(()=>this.destroy());
  }
  hit(h){const c=Snd.ac();const now=c?c.currentTime:0;if(c)Snd.stick(now+.005,h,false);const b=this.w.querySelector(`[data-h=${h}]`);b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');this.onHit&&this.onHit(h,now)}
  destroy(){document.removeEventListener('keydown',this.kd)}
}
function drumNotes(seq,sub){const one=[];seq.split(' ').forEach(g=>[...g].forEach((h,j)=>one.push({h,acc:j===0})));const per=sub*4;let n=[...one];while(n.length%per&&n.length<per*4)n=n.concat(one);return n}
function patHTML(notes,sub,accent=true,kick=false){
  const per=sub*4;let h='';
  for(let b=0;b<notes.length/per;b++){h+='<div class="barx">';
    for(let beat=0;beat<4;beat++){h+=`<div class="beat"><div class="strokes" style="--sub:${sub}">`;
      for(let k=0;k<sub;k++){const i=b*per+beat*sub+k,n=notes[i],acc=accent&&n.acc;
        h+=`<div class="stk ${acc?'acc':''}" data-i="${i}"><span class="ac">${acc?'&gt;':''}</span><span class="r1">${n.h==='D'?'D':''}</span><span class="r2">${n.h==='E'?'E':''}</span></div>`}
      h+=`</div><div class="bn">${beat+1}${sub===3?'<span style="opacity:.7">·3</span>':''}${kick?'<span class="kk" title="bombo"></span>':''}</div></div>`}
    h+='</div>'}
  return h;
}

let bandStop=null;
const bassRoot=pc=>28+mod(pc-4,12);
const gtrAuto=pc=>{const r=autoRoot(GTR,pc);return[r.m,r.m+7,r.m+12]};
function keysVoicing(ch){const r=48+mod(ch.pc,12),third=ch.q==='min'?3:4;let v=[r,r+third,r+7];if(r>=55)v=v.map(x=>x-12);if(ch.q==='5')v=[r,r+7,r+12];return v}
/* parts: {style, bass:fn(ci)->[4 midi] o 'root', gtr:{kind:'power'|'arp', notes:fn(ci)}, keys:fn(ci)->[midi] o 'auto'} */
function bandPlay({bpm,prog,loops=2,parts={},onBar,onBeat,onEnd}){
  const c=Snd.ac();if(!c||!Snd.on)return 0;if(bandStop)bandStop();
  const style=parts.style||'rock',beat=60/bpm,ev=[];
  const sch=(dt,fn)=>ev.push({dt,fn});
  /* preparem els sons de corda abans de començar */
  const warm=new Set();
  prog.forEach((ch,ci)=>{
    if(parts.bass==='root')warm.add(bassRoot(ch.pc)+'b');else if(parts.bass)parts.bass(ci).forEach(m=>warm.add(m+'b'));
    if(parts.gtr)parts.gtr.notes(ci).forEach(m=>warm.add(m+'g'));
  });
  warm.forEach(k=>Snd.buf(parseInt(k),k.endsWith('b')));
  /* esdeveniments en temps relatiu (segons des de l'inici) */
  for(let i=0;i<4;i++)sch(i*beat,t=>Snd.hat(t,i===0?.35:.22));
  const d0=4*beat;
  for(let lp=0;lp<loops;lp++)prog.forEach((ch,ci)=>{
    const bd=d0+(lp*prog.length+ci)*4*beat;
    for(let e=0;e<8;e++){const dd=bd+e*beat/2;
      sch(dd,t=>{Snd.hat(t,style==='ballad'?(e%2?.06:.1):(e%2?.1:.17));
        if(e===0||(style==='rock'&&(e===4||e===5))||(style==='ballad'&&e===5))Snd.kick(t,style==='ballad'?.7:.95);
        if(e===2||e===6)Snd.snare(t,style==='ballad'?.28:.5);
        if(parts.bass==='root')Snd.pluckAt(bassRoot(ch.pc),true,t,.8,beat/2*.95);
        if(parts.gtr){const ns=parts.gtr.notes(ci);
          if(parts.gtr.kind==='power')Snd.gtr(ns,t,e===0?beat*.9:beat/2*.6,(parts.gtr.vol||1)*(e===0?1.1:.8));
          else{const k=[0,1,2,3,2,1,0,1][e];Snd.pluckAt(ns[Math.min(k,ns.length-1)],false,t,.9,1.4)}}
      })}
    if(parts.bass&&parts.bass!=='root'){const ns=parts.bass(ci);ns.forEach((m,k)=>sch(bd+k*beat,t=>Snd.pluckAt(m,true,t,1,beat*.95)))}
    if(parts.keys){const ns=parts.keys==='auto'?keysVoicing(ch):parts.keys(ci);[0,2].forEach(b=>sch(bd+b*beat,t=>ns.forEach(m=>Snd.key(m,t,beat*2*.95,parts.keysVol||.13))))}
  });
  ev.sort((a,b)=>a.dt-b.dt);
  const end=Snd.session(),timers=[],t0=c.currentTime+.2;
  const at=(dd,fn)=>timers.push(setTimeout(fn,Math.max(0,(t0+dd-c.currentTime)*1000)));
  /* programació amb antelació curta: cada 25 ms, el que ha de sonar en els propers 0,3 s */
  let k=0;
  const pump=()=>{const lim=c.currentTime+.3;while(k<ev.length&&t0+ev[k].dt<lim){const tt=Math.max(t0+ev[k].dt,c.currentTime+.01);try{ev[k].fn(tt)}catch(e){}k++}};
  pump();const iv=setInterval(pump,25);
  at(0,()=>onBeat&&onBeat(-1,-1,-1));
  for(let i=0;i<4;i++)at(i*beat,()=>onBeat&&onBeat(-1,i,-1));
  for(let lp=0;lp<loops;lp++)prog.forEach((ch,ci)=>{const bd=d0+(lp*prog.length+ci)*4*beat;at(bd,()=>onBar&&onBar(ci,lp));for(let b=0;b<4;b++)at(bd+b*beat,()=>onBeat&&onBeat(ci,b,lp))});
  const total=d0+loops*prog.length*4*beat;
  const stop=()=>{clearInterval(iv);end();timers.forEach(clearTimeout);if(bandStop===stop)bandStop=null};
  at(total+.6,()=>{stop();onEnd&&onEnd()});
  bandStop=stop;
  return (total+.2)*1000;
}

let cardStop=null;
function playCard(card,el,{countIn=true,met=true,tempo=80}={}){
  if(cardStop)cardStop();
  const c=Snd.ac();if(!c||!Snd.on)return 0;
  const end=Snd.session(),timers=[];
  cardStop=()=>{end();timers.forEach(clearTimeout);el&&$$('.ph',el).forEach(p=>p.classList.remove('on'));cardStop=null};
  onCleanup(()=>cardStop&&cardStop());
  const beat=60/tempo,B=card.p.length;let t=c.currentTime+.12;
  if(countIn){for(let i=0;i<B;i++)Snd.click(t+i*beat,i===0);t+=B*beat}
  const ev=[];card.p.forEach((arr,bi)=>{const sl=beat/arr.length;arr.forEach((v,si)=>ev.push({t:t+bi*beat+si*sl,v,d:sl}))});
  ev.forEach((e,i)=>{if(e.v!==1)return;let d=e.d;for(let j=i+1;j<ev.length&&ev[j].v===2;j++)d+=ev[j].d;Snd.tone(67,e.t,Math.max(.12,d*.92));Snd.stick(e.t,'D',false)});
  if(met)for(let i=0;i<B;i++)Snd.click(t+i*beat,false);
  const now=c.currentTime;
  if(el)for(let i=0;i<B;i++)timers.push(setTimeout(()=>$$('.ph',el).forEach(p=>p.classList.toggle('on',+p.dataset.b===i)),(t+i*beat-now)*1000));
  timers.push(setTimeout(()=>{el&&$$('.ph',el).forEach(p=>p.classList.remove('on'))},(t+B*beat-now)*1000+50));
  return (t+B*beat-now)*1000;
}

    c.area.insertAdjacentHTML('beforeend',`<div class="lcard"><div class="cardimg">${cardHTML(o.id)}</div><div class="lcside"><button class="btn acc" data-act="pl">▶ Escolta</button>${o.opts?`<p class="qq">${o.q}</p><div class="actions">${o.opts.map(x=>`<button class="btn ghost" data-o="${x}">${x}</button>`).join('')}</div>`:''}</div></div>`);
    let played=false;
    c.area.onclick=e=>{const t=e.target.closest('button');if(!t)return;
      if(t.dataset.act==='pl'){played=true;const ms=playCard(RC[o.id],$('.cardimg',c.area),{tempo:o.tempo||76});if(!o.opts&&!c.isDone){c.isDone=true;later(()=>c.done(o.ok),ms)}}
      if(t.dataset.o!==undefined){if(c.isDone)return;if(!played){c.say('Primer escolta-la.','hint');return}
        if(t.dataset.o===String(o.ans)){t.classList.add('right');c.isDone=true;c.done(o.ok)}else{t.classList.remove('wrong');void t.offsetWidth;t.classList.add('wrong');c.say(o.bad||'No. Mira la carta i escolta-la una altra vegada.','bad');Snd.no()}}};
  }}},
  pickcard(title,text,o){return{title,text,run(c){
    c.area.insertAdjacentHTML('beforeend',`<div class="actions"><button class="btn acc" data-act="pl">▶ Escolta el dictat</button></div><div class="opts" style="--n:${o.opts.length}">${o.opts.map(id=>`<button class="card" data-id="${id}">${cardHTML(id)}</button>`).join('')}</div>`);
    let played=false;
    c.area.onclick=e=>{const t=e.target.closest('button');if(!t)return;
      if(t.dataset.act==='pl'){played=true;playCard(RC[o.play],c.isDone?$(`[data-id="${o.play}"]`,c.area):null,{tempo:76})}
      if(t.dataset.id){if(c.isDone){playCard(RC[t.dataset.id],t,{tempo:76,countIn:false});return}
        if(!played){c.say('Primer escolta el dictat.','hint');return}
        if(t.dataset.id===o.play){t.classList.add('ok');t.insertAdjacentHTML('beforeend','<span class="tag">Aquesta</span>');c.isDone=true;c.done(o.ok);later(()=>playCard(RC[o.play],t,{tempo:76}),400)}
        else{t.classList.add('bad');if(!$('.tag',t))t.insertAdjacentHTML('beforeend','<span class="tag">No</span>');c.say('Aquesta no. Torna a escoltar i mira on hi ha els silencis.','bad');Snd.no()}}};
  }}}
};

/* ================= temes (progressions) ================= */
const CH=(pc,q,name)=>({pc,q,name});
const PROG={
  rock:[CH(9,'5','La5'),CH(5,'5','Fa5'),CH(0,'5','Do5'),CH(7,'5','Sol5')],
  balada:[CH(0,'maj','Do'),CH(9,'min','La m'),CH(5,'maj','Fa'),CH(7,'maj','Sol')],
  pop:[CH(0,'maj','Do'),CH(7,'maj','Sol'),CH(9,'min','La m'),CH(5,'maj','Fa')]
};
const SLOT={F:{semis:0,nom:'fonamental'},'5':{semis:7,alt:-5,nom:'5a'},'8':{semis:12,nom:'octava'},'3':{nom:'3a'}};
const slotSemis=(k,q)=>k==='3'?(q==='min'?3:4):SLOT[k].semis;
function autoShape(inst,ch,keys){const r=autoRoot(inst,ch.pc);const pos=[];keys.forEach(k=>{if(k==='F'){pos.push([r.s,r.f]);return}const p=nearPos(inst,r.m+slotSemis(k,ch.q),r);pos.push([p.s,p.f])});return{root:r,pos,midis:pos.map(([s,f])=>inst.tuning[s]+f)}}

function qDictat(stage,cfg,g,done,opt){

  const seen=new Set([target.sig]),dis=[];
  const add=list=>{for(const c of shuffle(list)){if(dis.length>=L.opts-1)break;if(c.beats!==target.beats||c.m!==target.m||seen.has(c.sig))continue;seen.add(c.sig);dis.push(c)}};

        say(`✓ ${errors?'Ara sí.':'Ben escoltat.'} Mira com avança el pols mentre sona.`,'ok');$('[data-a=skip]',stage).remove();

function qDrum(stage,cfg,g,done,opt){
  const sub=cfg.sub,notes=drumNotes(cfg.seq,sub),per=sub*4,L=notes.length,tempo=opt.tempo;
  stage.insertAdjacentHTML('beforeend',`<div class="banner">Primer escolta una volta. Després toques tu.</div><div class="patwrap"><div class="pat">${patHTML(notes,sub)}</div></div><div class="actions goact" style="justify-content:center"><button class="btn acc big" data-a="go">▶ Comença</button></div><div class="padsbox"></div>`);
  const els=$$('.stk',stage),banner=$('.banner',stage),pads=new Pads($('.padsbox',stage));
  const exp=[];let extras=0,judging=false,curLp=-1;
  pads.onHit=(h,now)=>{if(!judging)return;const c=Snd.ctx,lat=(c.outputLatency||0)+(c.baseLatency||0),tt=now-lat;let best=null,bd=1;
    for(const e of exp){if(e.hit)continue;const d=Math.abs(tt-e.t);if(d<bd){bd=d;best=e}}
    if(best&&bd<.17){best.hit=true;best.ok=best.h===h;best.dt=tt-best.t;if(best.lp===curLp)els[best.i].classList.add(best.ok?'good':'wh')}else extras++};
  $('[data-a=go]',stage).onclick=()=>{$('.goact',stage).remove();start()};
  function start(){
    const c=Snd.ac();if(!c)return;const end=Snd.session();onCleanup(end);
    const spb=60/tempo/sub,t=c.currentTime+.2,q=[];
    for(let k=0;k<4;k++){Snd.click(t+k*sub*spb,k===0);q.push({t:t+k*sub*spb,ci:k+1})}
    const t0=t+per*spb,loops=3;
    for(let lp=0;lp<loops;lp++)for(let i=0;i<L;i++){const tt=t0+(lp*L+i)*spb,n=notes[i];
      if(lp===0)Snd.stick(tt,n.h,n.acc);if(i%sub===0)Snd.click(tt,i%per===0);
      if(lp>0)exp.push({t:tt,h:n.h,i,lp,hit:false});q.push({t:tt,i,lp})}
    const fin=t0+loops*L*spb;let raf;
    const tick=()=>{const now=c.currentTime;
      while(q.length&&q[0].t<=now){const e=q.shift();if(e.ci){banner.textContent=e.ci+'…';continue}
        els.forEach(x=>x.classList.remove('now'));els[e.i].classList.add('now');
        if(e.i===0){curLp=e.lp;if(e.lp===0)banner.textContent='Escolta…';else{banner.textContent=e.lp===1?'Ara tu':'Una altra volta';banner.classList.remove('go');void banner.offsetWidth;banner.classList.add('go');els.forEach(x=>x.classList.remove('good','wh','miss'))}}
        if(e.lp===0&&e.i===L-sub)banner.textContent='Prepara\'t…'}
      judging=now>=t0+L*spb-.17;
      exp.forEach(x=>{if(!x.hit&&!x.missed&&now>x.t+.17){x.missed=true;if(x.lp===curLp)els[x.i].classList.add('miss')}});
      if(now>fin+.25){finish();return}raf=requestAnimationFrame(tick)};
    raf=requestAnimationFrame(tick);onCleanup(()=>cancelAnimationFrame(raf));
  }
  function finish(){
    judging=false;els.forEach(x=>x.classList.remove('now'));
    const good=exp.filter(e=>e.hit&&e.ok),wh=exp.filter(e=>e.hit&&!e.ok).length,score=Math.max(0,good.length-extras*.5)/exp.length;
    const avg=good.length?good.reduce((a,e)=>a+e.dt,0)/good.length:0;
    const tips=[];if(wh)tips.push(`${wh} cop${wh>1?'s':''} amb la mà equivocada.`);if(extras)tips.push(`${extras} cop${extras>1?'s':''} de més.`);
    if(good.length>4&&avg>.045)tips.push('Tendeixes a anar una mica tard: escolta el metrònom.');if(good.length>4&&avg<-.045)tips.push('Tendeixes a avançar-te: espera el clic.');
    done(score,{pct:Math.round(good.length/exp.length*100),tips,line:'dels cops a temps i amb la mà correcta'});
  }
}

  const sc=screen(hud(g,node.nom,n)+`<div class="stage" style="--g:${g.col}"></div>`);
  const stage=$('.stage',sc);
  stage.innerHTML=`<div class="splash"><span class="kicker">${node.tema.prog?`TEMA ${node.tema.n} · `:''}${typeLabel(node).toUpperCase()}${single?'':` · ${n} REPTES`}</span><h2>${node.nom}</h2>${node.tip?`<p class="tip">${node.tip}</p>`:''}${tempo?`<div class="tempo"><button class="btn ghost sm" data-a="tm">−5</button><span class="bpm">♩ = ${tempo}</span><button class="btn ghost sm" data-a="tp">+5</button></div>`:''}${node.kind==='chord'?`<label class="tog"><input type="checkbox" id="usfirst" ${Store.get('us',false)?'checked':''}> Xifrat americà primer (Gm, D7…)</label>`:''}${single?'<p class="subq">Toca amb els coixinets de la pantalla o amb les tecles F (esquerra) i J (dreta).</p>':''}<button class="btn acc big" data-a="start">Comença</button></div>`;
  const setT=v=>{tempo=Math.max(40,Math.min(140,v));Store.set(`tempo-${gid}-${node.id}`,tempo);$('.bpm',stage).textContent='♩ = '+tempo};
  sc.addEventListener('click',e=>{if(e.target.closest('[data-act=map]'))renderMap(gid)});
  const res=[];let i=0;
  const ps=()=>res.map(r=>r===2?'net':r===1?'aj':'no');
  const runQ=st=>{setPips(sc,i,ps());ENG[node.kind](st,node.cfg,g,(r,info)=>{
    if(single){showResults(gid,idx,r,[],info);return}
    res.push(r);i++;setPips(sc,i,ps());
    if(i>=n)showResults(gid,idx,res.reduce((a,x)=>a+(x===2?1:x===1?.5:0),0)/n,res);
    else{const nx=document.createElement('div');nx.className='stage screen';nx.style.setProperty('--g',g.col);st.replaceWith(nx);runQ(nx)}},{tempo})};
  stage.onclick=e=>{const t=e.target.closest('[data-a]');if(!t)return;
    if(t.dataset.a==='tm')setT(tempo-5);if(t.dataset.a==='tp')setT(tempo+5);
    if(t.dataset.a==='start'){const us=$('#usfirst',stage);if(us)Store.set('us',us.checked);Snd.ac();
      const fresh=document.createElement('div');fresh.className='stage screen';fresh.style.setProperty('--g',g.col);stage.replaceWith(fresh);runQ(fresh)}};
}
function showResults(gid,idx,score,res,info){
  const g=GAMES[gid],node=FLAT[gid][idx],nx=FLAT[gid][idx+1];
  const stars=score>=.95?3:score>=.75?2:score>=.5?1:0;P.set(gid,node.id,{done:stars>=1,stars,best:Math.round(score*100)});
  const pct=info?info.pct:Math.round(score*100);
  const net=res.filter(r=>r===2).length,aj=res.filter(r=>r===1).length;
  const line=info?`${info.line}.`:`${net} de ${res.length} sense ajuda${aj?` · ${aj} amb pistes o errors`:''}.`;
  const head=['Encara no','Superat','Molt bé','Impecable'][stars];
  const tips=info&&info.tips&&info.tips.length?`<p class="tip">${info.tips.join(' ')}</p>`:'';
  const sc=screen(`<div class="stage" style="--g:${g.col}"><div class="result"><span class="kicker">${node.nom.toUpperCase()}</span><div class="bignum">${pct}%</div><div class="meter">${[1,2,3].map(s=>`<i class="${s<=stars?'on':''}"></i>`).join('')}</div><h2>${head}</h2><p class="ltext">${line}</p>${!info?`<div class="pips" style="width:min(360px,100%)">${res.map(r=>`<i class="pip ${r===2?'net':r===1?'aj':'no'}"></i>`).join('')}</div>`:''}${tips}${stars===0?'<p class="ltext">Per obrir l\'etapa següent cal arribar al 50%. Torna-hi: cada vegada surt diferent.</p>':''}
    <div class="actions"><button class="btn ${stars&&nx?'ghost':'acc big'}" data-act="again">Torna-hi</button>${stars&&nx?`<button class="btn acc big" data-act="next">${nx.nom} →</button>`:''}<button class="btn ghost" data-act="map">Temes</button></div></div></div>`);
  if(stars)Snd.ok();
  sc.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
    if(a==='again')startNode(gid,idx);if(a==='next')startNode(gid,idx+1);if(a==='map')renderMap(gid)});
}
function runFree(gid){
  const g=GAMES[gid];
  const sc=screen(`<div class="hud" style="--g:${g.col}"><button class="back" data-act="map" aria-label="Tornar als temes">✕</button><div class="htitle">${g.free.nom}</div></div><div class="stage" style="--g:${g.col}"><span class="kicker">TALLER LLIURE</span></div>`);
  sc.addEventListener('click',e=>{if(e.target.closest('[data-act=map]'))renderMap(gid)});
  g.free.fn($('.stage',sc),g);
}

/* ================= arrencada ================= */
function route(){const h=(location.hash||'').slice(1);if(GAMES[h])renderMap(h);else renderHome()}
window.addEventListener('hashchange',route);
$('#home-btn').onclick=()=>{if(location.hash==='#inici')renderHome();else location.hash='inici'};
const sb=$('#snd');sb.addEventListener('click',()=>{Snd.on=!Snd.on;sb.setAttribute('aria-pressed',Snd.on);sb.textContent=Snd.on?'♪ So':'♪ Sense so';if(!Snd.on&&bandStop)bandStop()});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!/BUTTON|SELECT|INPUT/.test(e.target.tagName)){const b=$('[data-a=next],[data-act=cont]:not(:disabled)',app);if(b)b.click()}});
route();
</script>
